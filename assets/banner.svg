<svg width="900" height="214" viewBox="0 0 900 214" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.25); }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -20; }
    }
    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseDot 2.4s ease-in-out infinite;
    }
    .flow {
      stroke-dasharray: 5 5;
      animation: flowDash 2.2s linear infinite;
    }
  </style>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="900" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="heroAccent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="barAccent" x1="0" y1="44" x2="0" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="subtleGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="900" height="214" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="214" fill="url(#heroBg)"/>
    <rect width="900" height="214" fill="url(#subtleGrid)"/>
    <rect width="900" height="3.5" fill="url(#heroAccent)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="212.5" rx="15.25" stroke="#30363D" stroke-width="1.5"/>

  <!-- Left vertical accent bar -->
  <rect x="34" y="38" width="4" height="138" rx="2" fill="url(#barAccent)"/>

  <!-- Top handle & availability pill -->
  <text x="54" y="50" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
    @Thush099
  </text>
  <rect x="136" y="34" width="208" height="22" rx="11" fill="#0F291E" stroke="#34D399" stroke-opacity="0.45"/>
  <circle cx="151" cy="45" r="3.5" fill="#34D399" class="pulse"/>
  <text x="163" y="49" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.4">
    OPEN TO AI / ML ENGINEERING
  </text>

  <!-- Main identity & value proposition -->
  <text x="54" y="92" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6">
    Thushanth Mahendran
  </text>
  <text x="54" y="120" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    BSc (Hons) AI &amp; Data Science · IIT / Robert Gordon University
  </text>
  <text x="54" y="147" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">
    OCR forensics, adversarial agent evals, hybrid RAG &amp; PyTorch ML.
  </text>

  <!-- Compact metadata chips -->
  <rect x="54" y="162" width="134" height="22" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="121" y="177" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Colombo, Sri Lanka</text>

  <rect x="196" y="162" width="166" height="22" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="279" y="177" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Ex-AI Intern @ DecodeLabs</text>

  <rect x="370" y="162" width="192" height="22" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="466" y="177" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Agent Eval · CV · RAG · OSS</text>

  <!-- Right Panel: Minimalist ML Systems DAG -->
  <rect x="654" y="30" width="216" height="154" rx="12" fill="#0D1117" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
  <text x="670" y="50" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600">SYSTEM TOPOLOGY</text>

  <!-- Flow connectors -->
  <path d="M 734 80 L 762 80" stroke="#38BDF8" stroke-width="1.6" class="flow"/>
  <path d="M 734 140 L 762 140" stroke="#818CF8" stroke-width="1.6" class="flow"/>
  <path d="M 808 96 L 808 124" stroke="#34D399" stroke-width="1.6" class="flow"/>
  <path d="M 701 96 L 701 124" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.4" class="flow"/>

  <!-- Node 1 -->
  <rect x="668" y="64" width="66" height="32" rx="7" fill="#161B22" stroke="#38BDF8" stroke-opacity="0.65"/>
  <text x="701" y="84" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">RETRIEVE</text>

  <!-- Node 2 -->
  <rect x="762" y="64" width="92" height="32" rx="7" fill="#161B22" stroke="#34D399" stroke-opacity="0.65"/>
  <text x="808" y="84" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">VERIFY / NLI</text>

  <!-- Node 3 -->
  <rect x="668" y="124" width="66" height="32" rx="7" fill="#161B22" stroke="#818CF8" stroke-opacity="0.65"/>
  <text x="701" y="144" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">PROFILE</text>

  <!-- Node 4 -->
  <rect x="762" y="124" width="92" height="32" rx="7" fill="#161B22" stroke="#FBBF24" stroke-opacity="0.65"/>
  <text x="808" y="144" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">DRIFT GUARD</text>
</svg>
